<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GAMIFICA: El misterio de las cinco habitaciones</title><meta name="color-scheme" content="dark">
<style>
:root{--bg:#0b0f1e;--p:#151b34;--a:#f5c542;--c:#5ee7ff;--ok:#4ade80;--ko:#f87171;--t:#e8ecff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1e2a5a,var(--bg));color:var(--t);font:16px/1.45 system-ui,sans-serif;min-height:100vh}
#app{max-width:860px;margin:auto;padding:10px}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--p);border:1px solid #2c3766;border-radius:12px;padding:8px 12px;position:sticky;top:0;z-index:5}
.hud b{color:var(--a)}.hud .sp{flex:1;min-width:120px}button{font:inherit;cursor:pointer;border:1px solid #3a4780;background:#222b55;color:var(--t);border-radius:10px;padding:8px 12px}
button:hover{border-color:var(--c);box-shadow:0 0 10px #5ee7ff55}button.pr{background:linear-gradient(135deg,#f5c542,#e08a1e);color:#1a1200;font-weight:700;border:0}
#sc{position:relative;height:190px;border-radius:14px;margin:10px 0;overflow:hidden;border:1px solid #3a4780}
#sc::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#ffd98055,transparent 60%);animation:fl 3s infinite alternate;pointer-events:none}
@keyframes fl{to{opacity:.35}}.dec{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:2.6rem;letter-spacing:.6rem;opacity:.75}
.hs{position:absolute;font-size:2.1rem;background:none;border:0;padding:0;animation:fo 2.5s infinite ease-in-out;z-index:2;filter:drop-shadow(0 0 8px #ffe08a)}.hs:hover{transform:scale(1.3);box-shadow:none}
@keyframes fo{50%{transform:translateY(-6px)}}.door{position:absolute;right:10px;top:8px;font-size:2rem}
#pn,.card{background:var(--p);border:1px solid #2c3766;border-radius:14px;padding:14px}
h2,h3{margin:.2em 0 .5em}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.row>span{flex:1;min-width:200px}
select{max-width:100%;font:inherit;background:#0e1430;color:var(--t);border:1px solid #3a4780;border-radius:8px;padding:6px}
.ok{outline:2px solid var(--ok)}.ko{outline:2px solid var(--ko)}#fb{margin-top:10px;min-height:1.4em}
.chip{display:inline-block;margin:3px;padding:6px 10px;border-radius:20px;background:#27306a;border:1px solid #4a58a8;cursor:grab;user-select:none;font-size:.9rem}.chip.sel{background:var(--a);color:#111}
.bk{min-height:70px;border:2px dashed #4a58a8;border-radius:12px;padding:6px;margin:6px 0}.bk h4{margin:0 0 4px;color:var(--c)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.sel{background:var(--a);color:#111}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}.pad button{padding:12px;font-size:1.2rem}
#dsp{font:700 2rem monospace;letter-spacing:.5rem;text-align:center;background:#000;color:var(--ok);border-radius:8px;padding:6px;margin:8px auto;max-width:300px;min-height:3rem}
.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}.ov .card{max-width:520px;max-height:90vh;overflow:auto;text-align:center}
.key{font-size:4rem;animation:sp 1.2s}@keyframes sp{from{transform:rotate(-360deg) scale(0)}}.big{font-size:3rem;animation:pu 1s infinite alternate}@keyframes pu{to{transform:scale(1.15)}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;text-align:left}.g div{background:#0e1430;border-radius:10px;padding:8px}.g b{display:block;color:var(--a);font-size:1.3rem}
textarea{width:100%;min-height:90px;background:#0e1430;color:var(--t);border:1px solid #3a4780;border-radius:8px;padding:8px;font:inherit}
.tm{color:var(--ko)!important}.note{background:#0e1430;border-left:3px solid var(--a);padding:6px 10px;margin:6px 0;border-radius:6px;font-size:.92rem}
</style></head><body><div id="app"></div>

function snd(f,d=.15,tp='sine'){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function drone(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(!amb){amb=AC.createOscillator();ag=AC.createGain();amb.frequency.value=55;amb.type='triangle';ag.gain.value=.025;amb.connect(ag);ag.connect(AC.destination);amb.start()}ag.gain.value=mute?0:.025}catch(e){}}
const good=()=>{snd(660);setTimeout(()=>snd(880),120);setTimeout(()=>snd(1100),240)},bad=()=>snd(180,.3,'sawtooth');

{k:'sort',q:'Clasifica las tarjetas en Dinámicas, Mecánicas y Componentes (Werbach y Hunter, 2013). Toca una tarjeta y luego su columna, o arrástrala.',B:['Dinámicas','Mecánicas','Componentes'],C:[[0,'Restricciones','Emociones y sensaciones','Narrativa','Progresión','Relaciones'],[1,'Retos','Oportunidades','Competición','Cooperación','Feedback','Recolección','Recompensas o incentivos','Transacciones','Turnos','Estados ganadores'],[2,'Logros','Avatares','Insignias','Luchas con el jefe','Colecciones','Combate','Desbloqueo de contenidos','Regalos','Leaderboards','Niveles','Puntos','Conquistas','Social Graphs','Equipos','Virtual Goods']],h:'Las dinámicas son los aspectos más globales; los componentes, los elementos más concretos.',err:'Las tarjetas en rojo volvieron al montón. Dinámicas: lo global; mecánicas: reglas; componentes: elementos concretos.',ex:'Dinámicas (5), mecánicas (10) y componentes (15), tal como los clasifica el documento.'},

{k:'match',q:'Cuatro personajes te cuentan qué disfrutan. Identifica el perfil de jugador de Bartle (1996) de cada uno.',rows:[['🧑‍🎤 Lucía: «Me encanta competir y que quede constancia de que soy superior»',P[0]],['🧑‍🤝‍🧑 Marco: «Lo mejor es relacionarme e intercambiar experiencias»',P[1]],['🧗 Ana: «Disfruto superando misiones y alcanzando objetivos»',P[2]],['🧭 Leo: «Me encanta descubrir lugares y elementos desconocidos»',P[3]]],h:'Asesinos: ganar y que otros pierdan. Socializadores: lo social. Triunfadores: retos y misiones. Exploradores: lo desconocido.',err:'Recuerda: los triunfadores se centran en superar retos y misiones; los exploradores, en descubrir.',ex:'Los cuatro perfiles básicos de Bartle: asesinos, socializadores, triunfadores y exploradores.'},
{k:'match',q:'Desafío: según las definiciones de cada perfil, ¿qué elemento de la gamificación favorece a cada uno?',rows:[['Leaderboards (ranking de usuarios)',P[0]],['Relaciones y Equipos',P[1]],['Retos y Niveles',P[2]],['Narrativa y Desbloqueo de contenidos',P[3]]],h:'Un ranking permite saberse superior; las relaciones permiten intercambiar; los retos permiten superarse; la narrativa invita a descubrir.',err:'Piensa qué busca cada perfil: ganar, relacionarse, superar retos o descubrir.',ex:'Según las dinámicas, mecánicas y componentes que usemos, se favorece la aparición de más jugadores de un tipo u otro.'},

{k:'order',q:'Ordena los pasos de Borrás (2015) para diseñar una experiencia gamificada. Toca los pasos en orden.',I:['Identificar el motivo o propósito','Averiguar qué les gusta a los estudiantes y sus motivaciones','Definir objetivos pedagógicos','Definir el grupo de usuarios','Identificar elementos y mecánicas','Establecer puntos e insignias','Definir el pensamiento de juego y el guion','Aplicarlo y probarlo','No olvidar la diversión','Mejorar la experiencia a partir de la práctica'],h:'Empieza por el propósito y termina mejorando con la práctica.',err:'Revisa el orden: del propósito a la mejora continua.',ex:'Diez pasos, desde el propósito hasta la mejora con la práctica.'},
{k:'match',q:'Relaciona cada situación con las tres líneas de trabajo de Fidalgo (2014).',rows:[['El docente elige el juego, el momento y las habilidades a desarrollar','Uso de juegos de forma controlada'],['Puntos, medallas, colecciones e interfaz como eje motivador','Utilizar elementos de los juegos'],['Transformar la asignatura con retos, niveles y narrativa','Rediseñar el proceso formativo como si fuese un juego']],h:'La tercera línea va más allá de una interfaz de juego.',err:'Distingue entre usar un juego, usar sus elementos o rediseñar todo el proceso.',ex:'Tres líneas: juegos controlados, elementos de juegos y rediseño completo del proceso.'},

{k:'match',q:'Identifica qué perspectiva de evaluación corresponde a cada situación.',rows:[['Encuesta sobre la ambientación, la interfaz y el interés en la historia','Evaluación de la experiencia'],['Valorar a cada miembro del equipo por su implicación, actitud y aportaciones','Evaluación de las competencias transversales'],['Un test de verdadero/falso sobre los contenidos tratados','Evaluación de los aprendizajes, objetivos y competencias específicas'],['Preguntar si la dificultad y los premios fueron adecuados','Evaluación de la experiencia'],['Valorar si se justifican los pasos y se usa un método adecuado de resolución','Evaluación de las competencias transversales'],['Resolver un reto in situ','Evaluación de los aprendizajes, objetivos y competencias específicas']],h:'Experiencia: satisfacción. Transversales: trabajo en equipo, resolución de problemas. Aprendizajes: contenidos.',err:'Pregúntate si se evalúa la satisfacción, una competencia transversal o un aprendizaje específico.',ex:'Tres perspectivas: experiencia, competencias transversales y aprendizajes.'},
{k:'tf',q:'Última cerradura: verdadero o falso.',I:[['La experiencia solo debe evaluarse al final del proceso.',0],['Los resultados de los jugadores pueden ser en sí mismos una forma de evaluar los contenidos.',1],['Las actividades de verdadero/falso o de establecer relaciones sirven para evaluar aprendizajes.',1]],h:'Conviene preguntar también durante la experiencia, para poder mejorarla.',err:'Revisa cuándo conviene recoger feedback y qué actividades se proponen para evaluar los aprendizajes.',ex:'Se recomienda preguntar durante y al final; los resultados del juego y las actividades como V/F evalúan contenidos.'}]}];
function newS(){return{r:0,s:0,pts:0,ok:0,ko:0,h:0,keys:0,bd:[],ac:[],sec:[],tt:0,rt:0,rh:[0,0,0,0,0],at:0,hu:0,fin:0,refl:''}}
function start(c){let l;try{l=JSON.parse(localStorage.getItem(K))}catch(e){}S=c&&l&&!l.fin?l:newS();drone();shell();go();clearInterval(tmr);tmr=setInterval(tick,1000)}
function shell(){$('#app').innerHTML=`<div class="hud"><b id="rn"></b><span class="sp"></span><span>⏱ <b id="tm"></b></span><span>⭐ <b id="pt"></b></span><span id="ks"></span><button onclick="hint()" title="Pista">💡</button><button onclick="mt()" id="mb">🔊</button><button onclick="ficha()">📋</button></div><div id="sc"></div><div id="pn"></div><div id="fb"></div>`}
function mt(){mute=!mute;$('#mb').textContent=mute?'🔇':'🔊';drone()}
function tick(){if(S.fin)return;S.tt++;S.rt++;hud();const l=M[S.r].t-S.rt;if(l==30)toast('⏳ Quedan 30 s de la sala. Sin presión: puedes seguir; solo pierdes el bonus de tiempo.');if(l==0)toast('⏰ Tiempo de sala agotado: continúa, lo importante es aprender.');if(S.tt%5==0)save()}
function hud(){const l=M[S.r].t-S.rt,e=$('#tm');if(!e)return;e.textContent=(l<0?'+':'')+fmt(l);e.className=l<=30?'tm':'';$('#pt').textContent=S.pts;$('#ks').textContent='🔑'.repeat(S.keys)+'▫️'.repeat(5-S.keys)}
function toast(m){snd(440,.2);$('#fb').innerHTML=`<div class="note">${m}</div>`}
function go(){save();const R=M[S.r],st=R.s[S.s];S.at=0;S.hu=0;$('#rn').textContent=`${S.r+1}/5 · ${R.n}`;const sc=$('#sc');sc.style.background=`linear-gradient(160deg,${R.bg})`;sc.innerHTML=`<div class="dec">${R.dec}</div><div class="door">🔒🚪</div>`;
if(!S.sec.includes(S.r)){const b=document.createElement('button');b.className='hs';b.textContent=R.sec.e;b.style.cssText=`left:${R.sec.x}%;top:${R.sec.y}%;font-size:1.3rem;opacity:.5`;b.onclick=()=>{S.sec.push(S.r);S.pts+=50;good();b.remove();toast('✨ ¡Objeto secreto! +50 puntos de bonificación.');hud();if(S.sec.length==3&&!S.ac.includes('🔎 Cazador de secretos')){S.ac.push('🔎 Cazador de secretos')}};sc.appendChild(b)}
$('#pn').innerHTML=`<small>Reto ${S.s+1} de ${R.s.length}</small><h3>${st.q}</h3><div id="bd"></div>`;$('#fb').innerHTML='';T[st.k](st,$('#bd'));hud()}
function hint(){const s=M[S.r].s[S.s];S.h++;S.rh[S.r]++;S.hu=1;snd(520);$('#fb').innerHTML=`<div class="note">💡 Pista: ${s.h}</div>`}
function win(m){good();const p=Math.max(25,(S.at?50:100)-(S.hu?25:0));S.pts+=p;S.ok++;hud();$('#fb').innerHTML=`<div class="note" style="border-color:var(--ok)">✅ ¡Correcto! ${m} <b>+${p}</b> 🎉<br><button class="pr" onclick="nx()" style="margin-top:8px">Continuar ➜</button></div>`;document.querySelectorAll('#bd button,#bd select').forEach(e=>e.disabled=true)}
function wr(m){S.ko++;S.at++;bad();$('#fb').innerHTML=`<div class="note" style="border-color:var(--ko)">🤔 ${m} Puedes intentarlo de nuevo, usa 💡 si necesitas ayuda.</div>`}
function nx(){const R=M[S.r];S.s++;if(S.s<R.s.length)return go();S.keys++;S.bd.push(R.b);let x=100;S.pts+=x;let m=`+${x} por superar la sala`;if(!S.rh[S.r]){S.pts+=150;S.ac.push(`🕊️ Sala ${S.r+1} sin pistas`);m+=' y +150 por no usar pistas'}
$('#sc .door').textContent='🔓🚪';snd(300,.5);const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card"><div class="key">🔑</div><h2>¡Llave ${S.keys} conseguida!</h2><p>La puerta se abre… Insignia: <b>${R.b}</b><br>${m}.</p><button class="pr" id="nb">${S.r<4?'Siguiente habitación ➜':'Abrir la puerta principal 🚪'}</button></div>`;document.body.appendChild(o);hud();$('#nb').onclick=()=>{o.remove();if(S.r<4){S.r++;S.s=0;S.rt=0;go()}else end()}}
const T={
find(s,p){const f=[];p.innerHTML='<div id="nl"></div>';s.it.forEach(i=>{const b=document.createElement('button');b.className='hs';b.textContent=i.e;b.style.cssText=`left:${i.x}%;top:${i.y}%`;b.onclick=()=>{b.remove();f.push(1);snd(700);$('#nl').insertAdjacentHTML('beforeend',`<div class="note">${i.e} ${i.m}</div>`);if(f.length==s.it.length)win(s.ex)};$('#sc').appendChild(b)})},
match(s,p){const O=sh([...new Set(s.rows.map(r=>r[1]))]);p.innerHTML=s.rows.map((r,i)=>`<div class="row"><span>${r[0]}</span><select data-i="${i}"><option value="">Elige…</option>${O.map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')+'<button class="pr" id="ck">Comprobar</button>';
$('#ck').onclick=()=>{let bad=0,emp=0;p.querySelectorAll('select').forEach(e=>{e.classList.remove('ok','ko');if(!e.value){emp++;return}const k=e.value==s.rows[e.dataset.i][1];e.classList.add(k?'ok':'ko');if(!k)bad++});if(emp)return toast('Completa todas las relaciones.');bad?wr(`${bad} relación(es) incorrecta(s) (en rojo). ${s.err}`):win(s.ex)}},
quiz(s,p){const sel=new Set();p.innerHTML=s.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')+(s.multi?'<button class="pr" id="ck">Comprobar</button>':'');
const chk=()=>{const a=[...sel].sort().join(),b=s.a.join();a==b?win(s.ex):wr(s.err)};p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(s.multi){sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')}else{sel.clear();sel.add(i);chk()}});if(s.multi)$('#ck').onclick=chk},
tf(s,p){p.innerHTML=s.I.map((r,i)=>`<div class="row"><span>${r[0]}</span><select data-i="${i}"><option value="">Elige…</option><option value="1">Verdadero</option><option value="0">Falso</option></select></div>`).join('')+'<button class="pr" id="ck">Comprobar</button>';
$('#ck').onclick=()=>{let bad=0,emp=0;p.querySelectorAll('select').forEach(e=>{e.classList.remove('ok','ko');if(e.value==''){emp++;return}const k=+e.value==s.I[e.dataset.i][1];e.classList.add(k?'ok':'ko');if(!k)bad++});if(emp)return toast('Responde todas.');bad?wr(`${bad} respuesta(s) incorrecta(s). ${s.err}`):win(s.ex)}},
lock(s,p){let v='';p.innerHTML=`<div id="dsp"></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'🔓'].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`;const d=$('#dsp');d.textContent='_';
p.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n=='⌫')v=v.slice(0,-1);else if(n=='🔓'){if(v==s.code){d.textContent='✔ '+v;return win(s.ex)}d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400);v='';d.textContent='_';return wr('Ese código no abre la cerradura.')}else if(v.length<8)v+=n;snd(500,.05);d.textContent=v||'_'})},
sort(s,p){let sel=null;const all=s.C.flatMap(c=>c.slice(1).map(t=>[t,c[0]]));p.innerHTML=`<div id="pool" class="bk" data-b="-1"><h4>Tarjetas</h4></div>${s.B.map((b,i)=>`<div class="bk" data-b="${i}"><h4>${b}</h4></div>`).join('')}<button class="pr" id="ck">Comprobar</button>`;
const mv=(c,b)=>{b.appendChild(c);c.classList.remove('sel');sel=null};
sh(all).forEach(([t,b])=>{const c=document.createElement('span');c.className='chip';c.textContent=t;c.draggable=true;c.dataset.ok=b;c.ondragstart=e=>{e.dataTransfer.setData('text','x');sel=c};c.onclick=e=>{e.stopPropagation();if(c.parentNode.dataset.b!='-1')return mv(c,$('#pool'));if(sel)sel.classList.remove('sel');sel=sel==c?null:c;if(sel)c.classList.add('sel')};$('#pool').appendChild(c)});
p.querySelectorAll('.bk').forEach(b=>{b.onclick=()=>{if(sel){mv(sel,b);snd(600,.06)}};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();if(sel)mv(sel,b)}});
$('#ck').onclick=()=>{if($('#pool').querySelector('.chip'))return toast('Aún quedan tarjetas por clasificar.');let bad=0;p.querySelectorAll('.bk:not(#pool) .chip').forEach(c=>{if(c.dataset.ok!=c.parentNode.dataset.b){bad++;c.style.outline='2px solid var(--ko)';$('#pool').appendChild(c)}});bad?wr(`${bad} tarjeta(s) mal clasificada(s). ${s.err}`):win(s.ex)}},
order(s,p){let q=[];p.innerHTML='<div id="ps"></div><hr><div id="ls"></div><button id="rs">↺ Reiniciar</button>';const draw=()=>{$('#ps').innerHTML=q.map((t,i)=>`<div class="note">${i+1}. ${t}</div>`).join('');$('#ls').innerHTML='';sh(s.I).forEach(t=>{if(q.includes(t))return;const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{q.push(t);snd(560,.06);if(q.length==s.I.length){const bad=q.filter((x,i)=>x!=s.I[i]).length;if(bad){q=[];wr(`${bad} paso(s) fuera de lugar. ${s.err}`)}else{draw();return win(s.ex)}}draw()};$('#ls').appendChild(b)})};$('#rs').onclick=()=>{q=[];draw()};draw()}};
function end(){S.fin=1;S.bd.push('🏆 Escapista de la Academia');const tot=S.ok+S.ko,pc=tot?Math.round(S.ok/tot*100):0;S.pc=pc;S.pts+=200;try{const l=JSON.parse(localStorage.getItem(LB)||'[]');l.push({p:S.pts,t:S.tt,d:new Date().toLocaleDateString('es')});l.sort((a,b)=>b.p-a.p);localStorage.setItem(LB,JSON.stringify(l.slice(0,3)))}catch(e){}save();
$('#app').innerHTML=`<div class="card" style="text-align:center;margin-top:10px"><div class="big">🚪✨</div><h2>¡FELICIDADES! HAS LOGRADO ESCAPAR DE LA ACADEMIA DEL CONOCIMIENTO</h2><p>🎁 Recompensa especial al escapar: +200 puntos</p><div class="g">${[['Tiempo',fmt(S.tt)],['Puntuación',S.pts],['Habitaciones','5/5'],['Correctas',S.ok],['Incorrectas',S.ko],['Pistas',S.h],['Llaves','🔑×'+S.keys],['Desempeño',pc+'%']].map(x=>`<div>${x[0]}<b>${x[1]}</b></div>`).join('')}</div><p><b>Insignias:</b> ${S.bd.join(' · ')}<br><b>Logros:</b> ${S.ac.join(' · ')||'—'} · Secretos: ${S.sec.length}/5</p>${lbh()}<h3>Reflexión final</h3><p>¿Qué aprendiste sobre la gamificación y cómo podrías aplicarla en tu futura práctica docente?</p><textarea id="rf" placeholder="Escribe tu reflexión…">${S.refl}</textarea><div class="row" style="justify-content:center"><button class="pr" onclick="S.refl=$('#rf').value;save();toast('Reflexión guardada ✔')">Guardar reflexión</button><button onclick="ficha()">📋 Mi ficha</button><button onclick="reset()">↺ Jugar de nuevo</button></div><div id="fb"></div></div>`;good()}
function lbh(){try{const l=JSON.parse(localStorage.getItem(LB)||'[]');return l.length?'<p><b>🏅 Leaderboard personal:</b> '+l.map((x,i)=>`${i+1}º ${x.p} pts (${fmt(x.t)})`).join(' · ')+'</p>':''}catch(e){return''}}
function ficha(){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card"><h2>📋 Ficha personal (PBL)</h2><p>⭐ <b>Points:</b> ${S.pts}<br>🎖️ <b>Badges:</b> ${S.bd.join(' · ')||'aún ninguna'}<br>🏅 <b>Logros:</b> ${S.ac.join(' · ')||'aún ninguno'}<br>🔑 Llaves: ${S.keys}/5 · ✅ ${S.ok} · ❌ ${S.ko} · 💡 ${S.h} · ✨ Secretos ${S.sec.length}/5</p>${lbh()}<button class="pr">Cerrar</button></div>`;document.body.appendChild(o);o.querySelector('button').onclick=()=>o.remove()}
function reset(){try{localStorage.removeItem(K)}catch(e){}home()}
function home(){clearInterval(tmr);let l=null;try{l=JSON.parse(localStorage.getItem(K))}catch(e){}$('#app').innerHTML=`<div class="card" style="text-align:center;margin-top:20px"><div class="big">🗝️🏛️</div><h1 style="color:var(--a)">GAMIFICA</h1><h2>El misterio de las cinco habitaciones</h2><p style="font-style:italic">«Bienvenido, explorador del conocimiento. La academia ha perdido sus cinco llaves del aprendizaje. Para recuperarlas tendrás que resolver acertijos, descubrir secretos y demostrar cuánto sabes sobre gamificación. Cada habitación es un desafío. Solo quien comprenda el verdadero sentido de gamificar podrá escapar».</p><p>Basado en «Gamificación en el aula», Servicio de Innovación Educativa de la UPM (julio de 2020). Duración: 15–20 min. Toca los objetos brillantes, usa 💡 si necesitas pistas (cuentan en tu informe) y busca los secretos ocultos.</p><div class="row" style="justify-content:center"><button class="pr" onclick="start(0)">▶ Empezar</button>${l&&!l.fin?'<button onclick="start(1)">⏩ Continuar partida</button>':''}</div></div>`}
home();
</script></body></html>
